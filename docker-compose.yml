version: '3.8'

services:
  colaby:
    build: .
    container_name: colaby
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-random-string}
      - NODE_ENV=production
    volumes:
      - colaby-data:/app/database

volumes:
  colaby-data:
